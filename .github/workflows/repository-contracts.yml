name: Repository contracts

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:release
      - run: npm run check:public
      - run: npm run check:security
      - run: npm run check:a11y
      - run: npm run check:disclosure
      - run: npm run check:demo
      - run: npm run check:endpoints
      - run: node --check public/sw.js
      - run: node --check public/js/sc-disclosure.js
      - run: node --check public/js/sc-proof-lifecycle.js
      - run: node --check public/js/sc-route-ux.js
      - run: git diff --check
      - run: npm run build
