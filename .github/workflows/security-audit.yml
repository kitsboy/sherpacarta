name: Security audit

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency audit
        # Production dependencies only. The @lhci/cli -> lighthouse -> puppeteer
        # dev-toolchain carries unfixable transitive vulns that never ship to the
        # deployed site and only run on GitHub's CI runners. Scoping to --omit=dev
        # audits the actual production attack surface (0 vulns).
        run: npm audit --omit=dev --audit-level=high
      - name: Repository secret scan
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude-dir=node_modules --exclude='*.lock' --exclude='*.md' --exclude-dir=docs --exclude='*.local' '(BEGIN (RSA|OPENSSH|EC|PGP) PRIVATE KEY|\bnsec1?[a-z0-9]{20,}|macaroon|-----BEGIN)' .; then
            echo 'Potential private-key material found.' >&2
            exit 1
          fi
      - name: Security policy exists
        run: test -f public/security.html && test -f public/.well-known/security.txt
