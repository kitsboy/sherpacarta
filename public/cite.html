<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cite SherpaCarta</title><meta name="description" content="Generate a versioned citation for SherpaCarta and preserve its source and hash references."><link rel="canonical" href="https://sherpacarta.org/cite.html"><link rel="stylesheet" href="/fonts/fonts.css?v=866"><link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css?v=866"><link rel="stylesheet" href="/sc-main.css?v=866"><style>.cite-page{max-width:760px;margin:auto;padding:clamp(2rem,7vw,6rem) 1.25rem}.cite-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:3rem}.cite-brand{font:700 1.5rem var(--serif)}.cite-brand span{color:var(--em)}.cite-page h1{font:700 clamp(2.6rem,7vw,4.5rem)/1 var(--serif);margin:.7rem 0 1rem}.cite-page h1 em{color:var(--em)}.cite-page p{color:var(--text2);line-height:1.8}.cite-box{margin-top:2rem;padding:1.25rem;border:1px solid var(--border2);border-radius:var(--radius-lg);background:var(--bg2)}.cite-box textarea{width:100%;min-height:9rem;padding:.8rem;border:1px solid var(--border2);border-radius:.6rem;background:var(--bg);color:var(--text);font: .75rem/1.65 var(--mono);resize:vertical}.cite-actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:.75rem}@media(max-width:600px){.cite-actions{display:grid}.cite-actions .btn{justify-content:center}}</style><!-- suite analytics: first-party Umami (sherpacarta) -->

</head><body><main class="cite-page"><header class="cite-top"><a class="cite-brand" href="/">Sherpa<span>Carta</span></a><a class="btn btn-ghost" href="/archive.html">Archive</a></header><div class="archive-kicker" style="color:var(--em2);font:.65rem var(--mono);letter-spacing:.18em;text-transform:uppercase">Versioned citation</div><h1>Cite the source, <em>not the slogan.</em></h1><p>Generate a citation that includes the current document version, article count, source URL, and hash record. Copy it into research, policy, or press work.</p><section class="cite-box"><label for="citation" style="display:block;font:.65rem var(--mono);color:var(--text3);margin-bottom:.5rem">Citation</label><textarea id="citation" readonly>Loading current release…</textarea><div class="cite-actions"><button class="btn btn-primary" id="copy-citation" type="button"><i class="fas fa-copy"></i> Copy citation</button><a class="btn btn-ghost" href="/api/v1/hash.json">Open hash record</a></div><p id="cite-status" role="status" style="font:.7rem var(--mono);margin-top:.7rem"></p></section><p style="margin-top:2rem;font-size:.75rem;color:var(--text3)"><a href="/verify.html">Verify proof</a> · <a href="/release-manifest.json">Release manifest</a> · <a href="/support.html">Support</a></p></main><script>fetch('/data/releases.json',{cache:'no-cache'}).then(r=>r.json()).then(d=>{const c=d.current||{};document.getElementById('citation').value=`SherpaCarta. The Global Digital Magna Carta. Version ${c.version}, ${c.articleCount} articles. Published ${c.publishedAt}. ${location.origin}${c.source}. Hash record: ${location.origin}${c.hash}. https://sherpacarta.org`;}).catch(()=>{document.getElementById('citation').value='Release metadata unavailable. Cite the source manually and verify before publication.'});document.getElementById('copy-citation').onclick=()=>navigator.clipboard.writeText(document.getElementById('citation').value).then(()=>document.getElementById('cite-status').textContent='Citation copied locally.').catch(()=>document.getElementById('cite-status').textContent='Copy failed; select the citation manually.');</script></body></html>
