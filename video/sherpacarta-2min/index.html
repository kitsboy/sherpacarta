<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030605;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #030605;
      }
      .host-scene {
        position: absolute;
        inset: 0;
        width: 1920px;
        height: 1080px;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="sherpacarta-2min"
      data-start="0"
      data-duration="120"
      data-width="1920"
      data-height="1080"
    >
      <div id="host-scene-01" class="host-scene" data-composition-id="scene-01" data-composition-src="compositions/scene-01.html" data-start="0.0" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-02" class="host-scene" data-composition-id="scene-02" data-composition-src="compositions/scene-02.html" data-start="6" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-03" class="host-scene" data-composition-id="scene-03" data-composition-src="compositions/scene-03.html" data-start="12" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-04" class="host-scene" data-composition-id="scene-04" data-composition-src="compositions/scene-04.html" data-start="18" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-05" class="host-scene" data-composition-id="scene-05" data-composition-src="compositions/scene-05.html" data-start="24" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-06" class="host-scene" data-composition-id="scene-06" data-composition-src="compositions/scene-06.html" data-start="30" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-07" class="host-scene" data-composition-id="scene-07" data-composition-src="compositions/scene-07.html" data-start="36" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-08" class="host-scene" data-composition-id="scene-08" data-composition-src="compositions/scene-08.html" data-start="42" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-09" class="host-scene" data-composition-id="scene-09" data-composition-src="compositions/scene-09.html" data-start="50" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-10" class="host-scene" data-composition-id="scene-10" data-composition-src="compositions/scene-10.html" data-start="58" data-duration="10" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-11" class="host-scene" data-composition-id="scene-11" data-composition-src="compositions/scene-11.html" data-start="68" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-12" class="host-scene" data-composition-id="scene-12" data-composition-src="compositions/scene-12.html" data-start="76" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-13" class="host-scene" data-composition-id="scene-13" data-composition-src="compositions/scene-13.html" data-start="84" data-duration="8" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-14" class="host-scene" data-composition-id="scene-14" data-composition-src="compositions/scene-14.html" data-start="92" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-15" class="host-scene" data-composition-id="scene-15" data-composition-src="compositions/scene-15.html" data-start="98" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-16" class="host-scene" data-composition-id="scene-16" data-composition-src="compositions/scene-16.html" data-start="102" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-17" class="host-scene" data-composition-id="scene-17" data-composition-src="compositions/scene-17.html" data-start="106" data-duration="6" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-18" class="host-scene" data-composition-id="scene-18" data-composition-src="compositions/scene-18.html" data-start="112" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>
      <div id="host-scene-19" class="host-scene" data-composition-id="scene-19" data-composition-src="compositions/scene-19.html" data-start="116" data-duration="4" data-track-index="1" data-width="1920" data-height="1080"></div>

      <div
        id="host-captions"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="120"
        data-track-index="3"
        data-width="1920"
        data-height="1080"
      ></div>

      <div
        id="host-overlays"
        data-composition-id="overlays"
        data-composition-src="compositions/overlays.html"
        data-start="0"
        data-duration="120"
        data-track-index="5"
        data-width="1920"
        data-height="1080"
      ></div>

      <audio id="narration" src="narration.wav" data-start="0" data-duration="120" data-track-index="20" data-volume="1"></audio>
    </div>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Soft crossfade entrance for each scene host (calm, cinematic).
      // 0.55s fade-in at each scene start; background is near-black so this
      // reads as a gentle dip-to-black transition, never a jump cut.
      const fadeInAt = [
        0.0, 6.0, 12.0, 18.0, 24.0, 30.0, 36.0, 42.0, 50.0, 58.0,
        68.0, 76.0, 84.0, 92.0, 98.0, 102.0, 106.0, 112.0, 116.0,
      ];
      fadeInAt.forEach((t, i) => {
        tl.from("#host-scene-" + String(i + 1).padStart(2, "0"), {
          opacity: 0,
          duration: 0.55,
          ease: "sine.inOut",
        }, t);
      });
      // Fade the very first scene in from black at the top of the film.
      tl.from("#host-scene-01", { opacity: 0, duration: 1.0, ease: "power2.out" }, 0);
      window.__timelines["sherpacarta-2min"] = tl;
    </script>
  </body>
</html>
